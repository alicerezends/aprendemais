<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprende+ | Aprender é uma aventura! ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

:root {
  --ink: #2f2a4a;
  --muted: #766f96;
  --purple: #7c5dfa;
  --purple-dark: #5e41d6;
  --pink: #ff7eb6;
  --pink-dark: #e85d99;
  --mint: #4cd4b0;
  --mint-dark: #2fb08e;
  --yellow: #ffd15c;
  --yellow-dark: #e6b235;
  --sky: #6ec6ff;
  --bg: #fdfaff;
  --line: #efe9ff;
  --shadow: 0 12px 30px rgba(124, 93, 250, 0.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(#e8deff 2px, transparent 2px),
    radial-gradient(#ffe3f0 2px, transparent 2px);
  background-size: 44px 44px;
  background-position: 0 0, 22px 22px;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--ink);
}

h1, h2, .brand, button {
  font-family: 'Fredoka', 'Nunito', sans-serif;
}

header {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
  padding: 14px max(20px, calc((100% - 1160px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: 700;
  color: var(--purple);
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff8ec7, #7c5dfa);
  display: grid;
  place-items: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 5px 0 #5e41d6;
  transform: rotate(-4deg);
}

.tag {
  font-size: 13px;
  font-weight: 800;
  color: #6b4ce6;
  background: #f3eeff;
  border: 2px solid #e3d7ff;
