<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprende+ | Aprender é uma aventura! ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

:root {
  --ink: #2f2a4a;
  --muted: #766f96;
  --purple: #7c5dfa;
  --purple-dark: #5e41d6;
  --pink: #ff7eb6;
  --pink-dark: #e85d99;
  --mint: #4cd4b0;
  --mint-dark: #2fb08e;
  --yellow: #ffd15c;
  --yellow-dark: #e6b235;
  --sky: #6ec6ff;
  --bg: #fdfaff;
  --line: #efe9ff;
  --shadow: 0 12px 30px rgba(124, 93, 250, 0.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(#e8deff 2px, transparent 2px),
    radial-gradient(#ffe3f0 2px, transparent 2px);
  background-size: 44px 44px;
  background-position: 0 0, 22px 22px;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--ink);
}

h1, h2, .brand, button {
  font-family: 'Fredoka', 'Nunito', sans-serif;
}

header {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
  padding: 14px max(20px, calc((100% - 1160px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 26px;
  font-weight: 700;
  color: var(--purple);
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff8ec7, #7c5dfa);
  display: grid;
  place-items: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 5px 0 #5e41d6;
  transform: rotate(-4deg);
}

.tag {
  font-size: 13px;
  font-weight: 800;
  color: #6b4ce6;
  background: #f3eeff;
  border: 2px solid #e3d7ff;
  padding: 8px 15px;
  border-radius: 99px;
}

main {
  max-width: 1160px;
  margin: 26px auto;
  padding: 0 20px;
}

/* HERO FOFO E INFANTIL */
.hero {
  background: linear-gradient(125deg, #8668ff 0%, #a57bf8 50%, #ff8fc4 100%);
  border-radius: 32px;
  color: white;
  padding: 32px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  box-shadow: 0 16px 35px rgba(134, 104, 255, 0.25);
  border: 4px solid #fff;
  position: relative;
  overflow: hidden;
}

.hero::before, .hero::after {
  content: '★';
  position: absolute;
  color: rgba(255, 255, 255, 0.22);
  pointer-events: none;
}
.hero::before { font-size: 90px; top: -15px; right: 34%; transform: rotate(15deg); }
.hero::after { content: '☁️'; font-size: 70px; bottom: -18px; left: 42%; opacity: 0.4; }

.hero-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.25);
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}

.hero h1 {
  font-size: clamp(26px, 4vw, 38px);
  margin: 0 0 8px;
  font-weight: 700;
  line-height: 1.15;
  text-shadow: 0 2px 10px rgba(66, 37, 138, 0.2);
}

.hero p {
  margin: 0;
  color: #fff6fc;
  font-size: 16px;
  font-weight: 700;
}

/* MASCOTE SVG ANIMADO NO HERO */
.hero-mascot-stage {
  position: relative;
  z-index: 2;
  background: rgba(255, 255, 255, 0.24);
  border: 3px solid rgba(255, 255, 255, 0.65);
  border-radius: 28px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  backdrop-filter: blur(6px);
  box-shadow: 0 10px 25px rgba(68, 36, 130, 0.18);
  animation: floaty 3.5s ease-in-out infinite;
}

@keyframes floaty {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

.speech-bubble {
  background: #fff;
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 800;
  max-width: 155px;
  line-height: 1.35;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
  position: relative;
}

/* LAYOUT E CARDS */
.layout {
  display: grid;
  grid-template-columns: 1fr 325px;
  gap: 22px;
  margin-top: 24px;
}

.maincol, .sidecol {
  display: grid;
  gap: 22px;
  align-content: start;
}

.card {
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 26px;
  padding: 24px;
  box-shadow: var(--shadow);
}

.card h2 {
  margin: 0 0 4px;
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
}

.sub {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 16px;
  font-weight: 600;
}

.sectionhead {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.section-icon {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: #f3eeff;
  font-size: 22px;
  flex: none;
}

/* BOTÕES ESTILO 3D FOFO */
button, input, select { font: inherit; }

button {
  border: 0;
  border-radius: 16px;
  padding: 12px 20px;
  background: var(--purple);
  color: white;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--purple-dark);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.04);
}

button:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--purple-dark);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

button.hero-btn {
  background: var(--yellow);
  color: #4a3500;
  box-shadow: 0 4px 0 var(--yellow-dark);
}

button.soft {
  background: #f3eeff;
  color: var(--purple);
  box-shadow: 0 4px 0 #dfd4ff;
}

button.hero-soft {
  background: rgba(255, 255, 255, 0.92);
  color: var(--purple);
  box-shadow: 0 4px 0 rgba(94, 65, 214, 0.35);
}

button.small {
  padding: 8px 14px;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 11px;
  flex-wrap: wrap;
}

/* ESTATÍSTICAS E BARRA DE PROGRESSO */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.stat {
  padding: 15px;
  border-radius: 20px;
  text-align: center;
  border: 2px solid transparent;
}
.stat:nth-child(1) { background: #f4f0ff; border-color: #e4daff; }
.stat:nth-child(2) { background: #fff0f7; border-color: #ffd6ea; }
.stat:nth-child(3) { background: #eafbf5; border-color: #c8f3e4; }

.stat b {
  font-family: 'Fredoka', sans-serif;
  font-size: 28px;
  display: block;
  color: var(--ink);
}

.stat small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 800;
}

.bar {
  height: 14px;
  background: #f1ecff;
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0;
  padding: 2px;
}

.bar > div {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--mint), var(--sky), var(--pink));
  border-radius: 99px;
  transition: width 0.4s cubic-bezier(.34, 1.56, .64, 1);
}

/* TURMINHA FOFA (NOVOS PERSONAGENS) */
.friends-box {
  margin-top: 18px;
  padding: 16px;
  background: linear-gradient(135deg, #fff7fc, #f5f1ff);
  border: 2px dashed #e2d4ff;
  border-radius: 22px;
}

.friends-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}

.friend-card {
  background: #fff;
  border: 2px solid #f0eaff;
  border-radius: 18px;
  padding: 12px 8px;
  text-align: center;
  transition: transform 0.2s;
}

.friend-card:hover {
  transform: translateY(-3px);
}

.friend-card svg {
  width: 64px;
  height: 64px;
  margin: 0 auto 4px;
  display: block;
}

.friend-card b {
  display: block;
  font-size: 14px;
  color: var(--purple);
}

.friend-card small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
}

/* INPUTS E AVISOS */
.notice {
  background: #fff9e6;
  border: 2px solid #ffe69c;
  color: #7d5b08;
  padding: 14px 16px;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
}

.hidden { display: none !important; }

.field { display: grid; gap: 6px; margin: 10px 0; }
.field label { font-size: 13px; font-weight: 800; color: var(--ink); }
.field input {
  width: 100%;
  border: 2px solid #e6defc;
  background: #fcfbff;
  border-radius: 14px;
  padding: 12px 14px;
  color: var(--ink);
  font-weight: 700;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--purple); background: #fff; }
.rowfields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* QUIZ E TREINO */
.quizbox {
  margin-top: 14px;
  padding: 20px;
  background: #faf8ff;
  border: 2px solid #ebe4ff;
  border-radius: 22px;
}

.question {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px;
  font-weight: 600;
  margin: 16px 0;
  color: var(--ink);
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.answer {
  background: #fff;
  color: var(--ink);
  border: 2px solid #e5ddfc;
  box-shadow: 0 3px 0 #e5ddfc;
  text-align: left;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 16px;
}

.answer:hover:not(:disabled) {
  border-color: var(--purple);
  background: #f7f4ff;
}

.answer.correct {
  background: #e4fbf2;
  border-color: var(--mint);
  box-shadow: 0 3px 0 var(--mint-dark);
  color: #1c6e58;
}

.answer.wrong {
  background: #ffedf2;
  border-color: var(--pink);
  box-shadow: 0 3px 0 var(--pink-dark);
  color: #9c3354;
}

.feedback {
  padding: 14px 16px;
  border-radius: 16px;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
}
.feedback.ok { background: #e4fbf2; color: #1c6e58; border: 2px solid #b8f0db; }
.feedback.no { background: #ffedf2; color: #9c3354; border: 2px solid #ffc9d9; }

/* BIBLIOTECA CLICÁVEL E COLORIDA */
.coursegrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.course {
  padding: 16px;
  border: 2px solid #ece5ff;
  border-radius: 20px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 4px 0 #ece5ff;
  transition: transform 0.15s, border-color 0.15s;
}

.course:hover {
  transform: translateY(-3px);
  border-color: var(--purple);
}

.course .emoji {
  font-size: 30px;
  display: inline-block;
  margin-bottom: 6px;
}

.course b {
  display: block;
  font-family: 'Fredoka', sans-serif;
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 3px;
}

.course small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  display: block;
  line-height: 1.35;
}

/* SIDEBAR TÓPICOS E HISTÓRICO */
.topic {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 0;
  border-bottom: 1px dashed #ebe5ff;
  font-size: 14px;
  font-weight: 800;
}
.topic:last-child { border: 0; }

.pill {
  border-radius: 99px;
  background: #f1ecff;
  color: var(--purple);
  padding: 5px 11px;
  font-size: 11px;
  font-weight: 900;
  white-space: nowrap;
}
.pill.good { background: #e4fbf2; color: #1e7a61; }
.pill.warn { background: #fff2d6; color: #a16207; }

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed #ebe5ff;
  font-size: 13px;
}
.history-item:last-child { border: 0; }

.empty {
  padding: 18px;
  text-align: center;
  color: var(--muted);
  background: #faf8ff;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 700;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  padding: 28px 16px 90px;
}

/* CHAT FLUTUANTE DA LUNA (NOVA MASCOTE IA) */
#luna-chat {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: min(370px, calc(100vw - 28px));
  z-index: 9999;
  background: #fff;
  border: 3px solid #e3d6ff;
  border-radius: 26px;
  box-shadow: 0 14px 40px rgba(94, 65, 214, 0.22);
  overflow: hidden;
}

#luna-head {
  background: linear-gradient(120deg, #8668ff, #ff8fc4);
  padding: 12px 16px;
  color: #fff;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn {
  border: 0;
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 15px;
  box-shadow: none;
  cursor: pointer;
}

#luna-settings {
  background: #f8f5ff;
  padding: 12px 14px;
  border-bottom: 2px solid #efe9ff;
  font-size: 12px;
}

#luna-settings input {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 2px solid #dfd4ff;
  margin: 6px 0;
  font-size: 12px;
}

#luna-body {
  height: 255px;
  overflow-y: auto;
  padding: 14px;
  background: #fcfaff;
}

.luna-msg {
  padding: 10px 14px;
  border-radius: 18px;
  margin: 8px 0;
  max-width: 88%;
  white-space: pre-wrap;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.45;
}

.luna-bot {
  background: #f0ebff;
  color: #3a2d63;
  border-bottom-left-radius: 4px;
}

.luna-user {
  background: #e1faef;
  color: #185c43;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

#luna-form {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: #fff;
  border-top: 2px solid #f2ecff;
}

#luna-input {
  min-width: 0;
  flex: 1;
  border: 2px solid #e4dbff;
  border-radius: 14px;
  padding: 10px 12px;
  font-weight: 700;
  outline: none;
}

#luna-input:focus { border-color: var(--purple); }

#luna-send {
  border-radius: 14px;
  background: var(--pink);
  box-shadow: 0 3px 0 var(--pink-dark);
  padding: 0 16px;
}

@media (max-width: 850px) {
  .layout { grid-template-columns: 1fr; }
  .coursegrid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
  .hero { flex-direction: column; text-align: center; padding: 26px 20px; }
  .actions { justify-content: center; }
  .tag { display: none; }
  .answers, .rowfields, .friends-grid { grid-template-columns: 1fr; }
  .coursegrid { grid-template-columns: 1fr; }
}
</style>
</head>

<header>
  <div class="brand">
    <div class="brand-
